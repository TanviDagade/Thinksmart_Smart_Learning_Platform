<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Think Smart | Verify OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body{
        font-family:'Poppins',sans-serif;
        background:#f8fafc;
        position:relative;
        overflow:hidden;
        opacity:0;
        animation:fadeIn .6s ease forwards;
        }

        .fade-out{
        animation:fadeOut .5s ease forwards;
        }

        @keyframes fadeIn{to{opacity:1}}
        @keyframes fadeOut{to{opacity:0}}

        body::before{
        content:"";
        position:absolute;
        width:100%;
        height:100%;
        background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
        background-size:40px 40px;
        z-index:0;
        }

        .graph{
        position:absolute;
        bottom:0;
        width:100%;
        height:200px;
        z-index:0;
        }

        .graph svg path{
        stroke:#6366f1;
        stroke-width:3;
        fill:none;
        stroke-dasharray:1000;
        stroke-dashoffset:1000;
        animation:drawGraph 5s linear infinite;
        }

        @keyframes drawGraph{
        to{stroke-dashoffset:0}
        }

        .login-box{
        width:420px;
        background:rgba(255,255,255,0.9);
        backdrop-filter:blur(10px);
        padding:40px;
        border-radius:20px;
        box-shadow:0 20px 50px rgba(0,0,0,0.08);
        z-index:2;
        position:relative;
        }

        .btn-primary{
        background:linear-gradient(135deg,#6366f1,#4f46e5);
        border:none;
        border-radius:10px;
        padding:10px;
        font-weight:500;
        box-shadow:0 0 15px rgba(99,102,241,0.4);
        }

        .btn-primary:hover{
        transform:scale(1.03);
        }

        .form-control:focus{
        border-color:#6366f1;
        box-shadow:0 0 0 .2rem rgba(99,102,241,.25);
        }

        .spinner-border{
        display:none;
        }

        .math-bg span{
        position:absolute;
        font-size:70px;
        font-weight:600;
        color:#6366f1;
        opacity:.12;
        pointer-events:none;
        animation:floatMath 6s ease-in-out infinite;
        }

        @keyframes floatMath{
        0%{transform:translateY(0)}
        50%{transform:translateY(-30px) rotate(10deg)}
        100%{transform:translateY(0)}
        }

        .math-bg span:nth-child(1){top:10%;left:8%}
        .math-bg span:nth-child(2){top:20%;right:10%}
        .math-bg span:nth-child(3){bottom:25%;left:15%}
        .math-bg span:nth-child(4){bottom:15%;right:12%}
        .math-bg span:nth-child(5){top:50%;left:5%}
        .math-bg span:nth-child(6){top:60%;right:8%}

    </style>

</head>

<body class="d-flex justify-content-center align-items-center vh-100 position-relative">

<div class="math-bg">
    <span>∑</span>
    <span>π</span>
    <span>∫</span>
    <span>√</span>
    <span>θ</span>
    <span>∞</span>
</div>

<div class="graph">
    <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
        <path d="M0,150 Q150,50 300,150 T600,150 T1000,120"></path>
    </svg>
</div>

<div class="login-box">

    <div class="text-center mb-4">
        <h3 class="fw-bold">Think Smart</h3>
        <p class="text-muted">Verify your email</p>
    </div>

    <div class="alert alert-danger text-center py-2" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{${action}}" method="post" onsubmit="showLoading(event)">

        <input type="hidden" name="email" th:value="${email}">
        <div class="mb-3">
            <label>Enter OTP sent to your email</label>
            <input type="text"
                   name="otp"
                   class="form-control"
                   placeholder="Enter OTP"
                   required>
        </div>

        <button class="btn btn-primary w-100">

            <span id="btnText">Verify OTP</span>
            <span class="spinner-border spinner-border-sm ms-2" id="spinner"></span>

        </button>

        <div class="text-center mt-3">
            <form action="/resendOtp" method="post">
                <button class="btn btn-outline-secondary w-100">
                    Resend OTP
                </button>
            </form>
        </div>

        <p class="text-center mt-3">
            <a href="/login"
               onclick="navigate(event,'/login')"
               class="text-decoration-none fw-semibold">
                Back to Login
            </a>
        </p>

    </form>

</div>

<script>

    function showLoading(event){

    event.preventDefault()

    document.getElementById("btnText").innerText="Verifying..."
    document.getElementById("spinner").style.display="inline-block"

    setTimeout(()=>{
    event.target.submit()
    },1500)

    }

    function navigate(event,url){
    event.preventDefault()
    document.body.classList.add("fade-out")
    setTimeout(()=>{
    window.location.href=url
    },400)

    }

    let time = 120

    const timer = document.createElement("p")
    timer.style.textAlign="center"
    timer.style.marginTop="10px"

    document.querySelector(".login-box").appendChild(timer)

    function updateTimer(){

    let minutes = Math.floor(time/60)
    let seconds = time%60

    timer.innerText = "OTP expires in " + minutes + ":" + (seconds<10?"0":"") + seconds

    time--

    if(time < 0){
    timer.innerText = "OTP expired"
    clearInterval(interval)
    }

    }

    updateTimer()

    let interval = setInterval(updateTimer,1000)

</script>

</body>
</html>
