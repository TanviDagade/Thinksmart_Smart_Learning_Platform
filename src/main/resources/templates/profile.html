<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Think Smart | Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body{
            font-family:'Poppins',sans-serif;
            background-color:#f4f6f9;
        }

        .profile-box{
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 10px 20px rgba(0,0,0,0.08);
        }

        .profile-value{
            background:#f1f5f9;
            padding:10px;
            border-radius:6px;
        }

        .avatar{
            font-size:70px;
            color:#6c757d;
        }

    </style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/home">Think Smart</a>
    <a href="/home" class="btn btn-outline-light btn-sm">Dashboard</a>
</nav>

<div class="container mt-5" style="max-width:650px">

    <div class="profile-box">

        <!-- Avatar -->
        <div class="text-center mb-4">
            <i class="bi bi-person-circle avatar"></i>
            <h3 class="mt-2">User Profile</h3>
            <p class="text-muted">Manage your account information</p>
        </div>

        <!-- Success Message -->
        <div class="alert alert-success" th:if="${success}">
            Password updated successfully
        </div>

        <!-- Name -->
        <div class="mb-3">
            <label class="fw-bold mb-1">
                <i class="bi bi-person"></i> Name
            </label>
            <div class="profile-value" th:text="${user.name}"></div>
        </div>

        <!-- Email -->
        <div class="mb-4">
            <label class="fw-bold mb-1">
                <i class="bi bi-envelope"></i> Email
            </label>
            <div class="profile-value" th:text="${user.email}"></div>
        </div>

        <hr>
        <h5 class="mb-3">
            <i class="bi bi-bar-chart"></i> Activity Overview
        </h5>

        <div class="row text-center">

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-calculator fs-3 text-primary"></i>
                        <h5 class="mt-2" th:text="${mathSolved}">0</h5>
                        <small class="text-muted">Math Problems Solved</small>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-journal-text fs-3 text-success"></i>
                        <h5 class="mt-2" th:text="${flashcardsStudied}">0</h5>
                        <small class="text-muted">Flashcards Studied</small>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-clipboard-check fs-3 text-warning"></i>
                        <h5 class="mt-2" th:text="${testsTaken}">0</h5>
                        <small class="text-muted">Practice Tests Taken</small>
                    </div>
                </div>
            </div>

        </div>
        <hr>

        <!-- Change Password -->
        <h5 class="mb-3">
            <i class="bi bi-key"></i> Change Password
        </h5>

        <form action="/changePassword" method="post">

            <div class="mb-3">
                <input type="password"
                       name="newPassword"
                       class="form-control mb-2"
                       placeholder="Enter new password"
                       required>

                <input type="password"
                       name="confirmPassword"
                       class="form-control"
                       placeholder="Confirm new password"
                       required>
            </div>

            <button class="btn btn-primary">
                <i class="bi bi-arrow-repeat"></i> Update Password
            </button>

        </form>

        <hr>

        <!-- Navigation Buttons -->
        <div class="d-flex gap-2">

            <a href="/home" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>

            <a href="/logout"
               class="btn btn-secondary"
               onclick="return confirm('Are you sure you want to logout?')">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
