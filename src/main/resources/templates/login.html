<!DOCTYPE html>
<html>
<head>
    <title>Think Smart | Login</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
        .fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }
        /* Grid background */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                    linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }
        /* Animated Graph Curve */
        .graph {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            z-index: 0;
        }
        .graph svg path {
            stroke: #6366f1;
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawGraph 5s linear infinite;
        }
        @keyframes drawGraph {
            to {
                stroke-dashoffset: 0;
            }
        }
        /* Floating Calculator Icon */
        @keyframes floatIcon {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes floatMath {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        /* Login Card */
        .login-box {
            width: 420px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            z-index: 2;
            position: relative;
        }
        /* Button */
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 500;
            box-shadow: 0 0 15px rgba(99,102,241,0.4);
        }

        .btn-primary:hover {
            transform: scale(1.03);
        }
        /* Input focus */
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.2rem rgba(99,102,241,0.25);
        }
        /* Loading Spinner */
        .spinner-border {
            display: none;
        }
        .math-bg span {
            position: absolute;
            font-size: 70px;
            font-weight: 600;
            color: #6366f1;
            opacity: 0.12;
            pointer-events: none;
            animation: floatMath 6s ease-in-out infinite;
        }
        /* Different Positions */
        .math-bg span:nth-child(1) { top: 10%; left: 8%; animation-duration: 6s; }
        .math-bg span:nth-child(2) { top: 20%; right: 10%; animation-duration: 8s; }
        .math-bg span:nth-child(3) { bottom: 25%; left: 15%; animation-duration: 7s; }
        .math-bg span:nth-child(4) { bottom: 15%; right: 12%; animation-duration: 9s; }
        .math-bg span:nth-child(5) { top: 50%; left: 5%; animation-duration: 10s; }
        .math-bg span:nth-child(6) { top: 60%; right: 8%; animation-duration: 7s; }

        .btn-primary:disabled {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(99,102,241,0.6); }
            70% { box-shadow: 0 0 0 15px rgba(99,102,241,0); }
            100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
        }

    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 position-relative">

<div class="math-bg">
    <span>∑</span>
    <span>π</span>
    <span>∫</span>
    <span>√</span>
    <span>θ</span>
    <span>∞</span>
</div>

<!-- Animated Graph -->
<div class="graph">
    <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
        <path d="M0,150 Q150,50 300,150 T600,150 T1000,120"></path>
    </svg>
</div>

<!-- Login Card -->
<div class="login-box">

    <div class="text-center mb-4">
        <h3 class="fw-bold">Think Smart</h3>
        <p class="text-muted">AI Powered Math Learning</p>
    </div>

    <div th:if="${success}" class="alert alert-success text-center py-2">
        <span th:text="${success}"></span>
    </div>

    <div class="alert alert-success text-center py-2" th:if="${message}">
        <span th:text="${message}"></span>
    </div>
    <div class="alert alert-danger text-center py-2" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <form onsubmit="showLoading(event)" action="/login" method="post">
        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter email"
                   required
                   pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                   title="Enter a valid email address (example: user@gmail.com)">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password">
        </div>

        <div class="text-end mb-3">
            <a href="/forgot-password"
               onclick="navigate(event, '/forgot-password')"
               class="text-decoration-none fw-semibold"
               style="color:#6366f1;">
                Forgot Password?
            </a>
        </div>

        <button class="btn btn-primary w-100 mt-2">
            <span id="btnText">Login</span>
            <span class="spinner-border spinner-border-sm ms-2" id="spinner"></span>
        </button>

        <p class="text-center mt-3">
            New here?
            <a href="/register" onclick="navigate(event, '/register')" class="fw-semibold text-decoration-none">
                Create Account
            </a>
        </p>
    </form>
</div>

<script>
    function showLoading(event) {
        event.preventDefault();

        document.getElementById("btnText").innerText = "Logging in...";
        document.getElementById("spinner").style.display = "inline-block";

        setTimeout(function() {
            event.target.submit();
        }, 1500);
    }

    function navigate(event, url) {
        event.preventDefault();
        document.body.classList.add("fade-out");

        setTimeout(() => {
            window.location.href = url;
        }, 400);
    }
</script>
</body>
</html>
