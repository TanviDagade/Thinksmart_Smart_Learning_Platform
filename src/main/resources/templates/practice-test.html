<!DOCTYPE html>
<html>
<head>
    <title>Think Smart | Practice Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
        }

        .quiz-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .option {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .option:hover {
            background: #eef2ff;
            border-color: #6366f1;
        }

        .option.selected {
            background: #6366f1;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/home">Think Smart</a>
    <a href="/home" class="btn btn-outline-light btn-sm">Dashboard</a>
</nav>

<div class="container mt-5">

    <h3 class="fw-bold mb-3">
        <i class="bi bi-pencil-square"></i> Practice Test
    </h3>
    <p class="text-muted">Choose subject and topic to begin your test</p>

    <div class="quiz-card mt-4">

        <!-- SUBJECT SELECT -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Select Subject</label>
            <select class="form-select" id="subjectSelect" onchange="loadTopics()">
                <option value="">-- Choose Subject --</option>
                <option value="algebra">Algebra</option>
                <option value="calculus">Calculus</option>
                <option value="geometry">Geometry</option>
                <option value="Probability & Statistics">Probability & Statistics</option>
                <option value="Matrices & Determinants">Matrices & Determinants</option>
            </select>
        </div>

        <!-- TOPIC SELECT -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Select Topic</label>
            <select class="form-select" id="topicSelect">
                <option value="">-- Choose Topic --</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="startTest()">Start Test</button>

        <div id="result" class="text-center mt-4 d-none">
            <h4 id="score"></h4>

            <button id="performanceBtn"
                    class="btn btn-info mt-3 me-2 d-none"
                    onclick="showPerformance()">
                View Performance
            </button>

            <button id="retakeBtn"
                    class="btn btn-secondary mt-3 d-none"
                    onclick="location.reload()">
                Retake Test
            </button>
        </div>

        <div id="quizArea" class="mt-4"></div>

    </div>

</div>

    function loadTopics() {
        const subject = document.getElementById("subjectSelect").value;
        const topicSelect = document.getElementById("topicSelect");

        topicSelect.innerHTML = '<option value="">-- Choose Topic --</option>';

        if (questionBank[subject]) {
            Object.keys(questionBank[subject]).forEach(topic => {
                topicSelect.innerHTML += `<option value="${topic}">${topic}</option>`;
            });
        }
    }

    function startTest() {
        const subject = document.getElementById("subjectSelect").value;
        const topic = document.getElementById("topicSelect").value;
        const quizArea = document.getElementById("quizArea");

        if (!subject || !topic) {
            quizArea.innerHTML = "<p class='text-danger'>Please select subject and topic.</p>";
            return;
        }

        currentQuestions = questionBank[subject][topic];
        currentIndex = 0;
        score = 0;
        userAnswers = [];

        showQuestion();
    }

    function showQuestion() {
        const quizArea = document.getElementById("quizArea");
        const q = currentQuestions[currentIndex];

        quizArea.innerHTML = `
        <h5>Question ${currentIndex + 1} of ${currentQuestions.length}</h5>
        <p class="mt-3">${q.question}</p>

        ${q.options.map(opt =>
            `<div class="option" onclick="selectOption(this)">${opt}</div>`
        ).join("")}

        <button class="btn btn-success mt-3" onclick="nextQuestion()">Next</button>
        <div id="result" class="mt-2"></div>
    `;

        selected = null;
    }

    function selectOption(element) {
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        selected = element.innerText;
    }

    function nextQuestion() {
        const result = document.getElementById("result");

        if (!selected) {
            result.innerHTML = "<span class='text-danger'>Select an option first.</span>";
            return;
        }

        // Save answer for performance
        userAnswers.push({
            question: currentQuestions[currentIndex].question,
            selected: selected,
            correct: currentQuestions[currentIndex].answer
        });

        if (selected === currentQuestions[currentIndex].answer) {
            score++;
        }

        currentIndex++;

        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        const quizArea = document.getElementById("quizArea");

        quizArea.innerHTML = `
        <h4 class="text-success">Test Completed ✔</h4>
        <p class="mt-3">Your Score: <strong>${score} / ${currentQuestions.length}</strong></p>

        <button class="btn btn-info mt-3 me-2" onclick="showPerformance()">
            View Performance
        </button>

        <button class="btn btn-secondary mt-3" onclick="startTest()">
            Retake Test
        </button>
    `;
    }

    function showPerformance() {
        const container = document.getElementById("quizArea");
        container.innerHTML = "<h4 class='mb-4'>Detailed Performance Report</h4>";

        userAnswers.forEach((item, index) => {

            const isCorrect = item.selected === item.correct;

            container.innerHTML += `
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h6>Q${index + 1}. ${item.question}</h6>
                    <p>
                        <strong>Your Answer:</strong>
                        <span class="${isCorrect ? 'text-success' : 'text-danger'}">

                        </span>
                    </p>
                    <p>
                        <strong>Correct Answer:</strong>
                        <span class="text-success">
                            ${item.correct}
                        </span>
                    </p>
                    <p>

                ? "<span class='text-success'>✔ Correct</span>"
                : "<span class='text-danger'>✖ Wrong</span>"}
                    </p>
                </div>
            </div>
        `;
        });
    }
