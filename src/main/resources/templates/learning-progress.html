<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Learning Progress</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --dark: #111827;
            --gray-bg: #f8fafc;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--gray-bg);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background-image:
                    linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #111827, #1f2937);
            padding-top: 20px;
            position: fixed;
            width: 220px;
            top: 0;
            left: 0;
        }

        .sidebar h4 {
            font-weight: 600;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 6px 12px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            transform: translateX(5px);
        }

        /* Main Content */
        .main-content {
            margin-left: 220px;
            padding: 40px;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h2 {
            font-weight: 700;
        }

        .dashboard-header p {
            color: #6b7280;
        }

        .card-modern {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s ease;
        }

        .card-modern:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content {
                margin-left: 0;
            }
        }

    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center text-white mb-4">Think Smart</h4>

    <a href="/home"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
    <a href="/math"><i class="bi bi-calculator me-2"></i> Math Solver</a>
    <a href="/text-analyzer"><i class="bi bi-image me-2"></i> Image Upload</a>
    <a href="/flashcards"><i class="bi bi-journal-text me-2"></i> Flashcards</a>
    <a href="/practice-test"><i class="bi bi-pencil-square me-2"></i> Practice Tests</a>
    <a href="/learning-progress"><i class="bi bi-bar-chart me-2"></i> Learning Progress</a>

    <hr class="text-secondary mx-3">

    <a href="/login"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
</div>

<!-- Main Content -->
<div class="main-content">

    <div class="dashboard-header">
        <h2>Learning Progress</h2>
        <p>Track your academic growth and performance</p>
    </div>

    <div class="container-fluid">
        <div class="row g-4">

            <!-- Streak -->
            <div class="col-md-4">
                <div class="card-modern text-center">
                    <h5 class="text-warning">Learning Streak</h5>
                    <h2 class="fw-bold text-warning mt-3">
                        <span th:text="${streak}"></span> Days
                    </h2>
                </div>
            </div>

            <div class="col-12">
                <div class="card-modern">

                    <h5 class="mb-3">
                        <i class="bi bi-bar-chart"></i> Topic Performance
                    </h5>

                    <canvas id="progressChart"></canvas>

                </div>
            </div>

            <!-- Activity Table -->
            <div class="col-12">
                <div class="card-modern">

                    <h5 class="mb-3">
                        <i class="bi bi-clock-history"></i> Recent Learning Activity
                    </h5>

                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Topic</th>
                            <th>Problem</th>
                            <th>Date</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:if="${#lists.isEmpty(activities)}">
                            <td colspan="3" class="text-center text-muted">
                                No learning activity yet
                            </td>
                        </tr>

                        <tr th:each="a : ${activities}">
                            <td th:text="${a.topic}"></td>
                            <td th:text="${a.problem}"></td>
                            <td th:text="${a.solvedAt}"></td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">

    const topicData = [[${topicStats}]];

    const labels = Object.keys(topicData);
    const values = Object.values(topicData);

    const ctx = document.getElementById('progressChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Problems Solved',
                data: values,
                borderWidth: 1
            }]
        }
    });

</script>

</body>
</html>
