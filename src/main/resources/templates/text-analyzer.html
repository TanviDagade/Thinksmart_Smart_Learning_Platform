<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Think Smart | Text Analyzer</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .app-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        pre {
            white-space: pre-wrap;
            font-family: "Courier New", monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/home">Think Smart</a>
    <a href="/home" class="btn btn-outline-light btn-sm">Dashboard</a>
</nav>

<div class="container mt-5">
    <!-- Page Title -->
    <h3 class="mb-2">
        <i class="bi bi-image"></i> Text Analyzer
    </h3>
    <p class="text-muted mb-4">
        Upload an image and extract text from it
    </p>
    <!-- MAIN CARD (same style as Math Solver) -->
    <div class="app-card">
        <!-- FORM -->
        <form method="post" action="/text-analyzer/analyze" enctype="multipart/form-data">

            <label class="mb-2 fw-semibold">Upload Image</label>
            <input type="file"
                   name="image"
                   class="form-control mb-3"
                   accept="image/*"
                   required>

            <button class="btn btn-primary">
                Solve
            </button>
        </form>

        <hr class="my-4">
        <!-- RESULT -->
        <h5>Extracted Text</h5>

        <pre class="alert alert-secondary mt-2" th:text="${result}">
            Upload an image to see result
        </pre>


    </div>
</div>
</body>
</html>
