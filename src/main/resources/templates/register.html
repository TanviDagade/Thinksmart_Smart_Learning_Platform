<!DOCTYPE html>
<html>
<head>
    <title>Think Smart | Register</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
        .fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* Floating Math Symbols */
        .math-bg span {
            position: absolute;
            font-size: 70px;
            font-weight: 600;
            color: #6366f1;
            opacity: 0.10;
            pointer-events: none;
            animation: floatMath 8s ease-in-out infinite;
        }

        .math-bg span:nth-child(1) { top: 8%; left: 8%; }
        .math-bg span:nth-child(2) { top: 18%; right: 12%; animation-duration: 10s; }
        .math-bg span:nth-child(3) { bottom: 25%; left: 15%; animation-duration: 7s; }
        .math-bg span:nth-child(4) { bottom: 15%; right: 12%; animation-duration: 9s; }
        .math-bg span:nth-child(5) { top: 50%; left: 5%; animation-duration: 11s; }
        .math-bg span:nth-child(6) { top: 60%; right: 8%; animation-duration: 6s; }

        @keyframes floatMath {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Animated Graph Line */
        .graph {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            z-index: 0;
        }

        .graph svg path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawGraph 6s linear infinite;
        }

        @keyframes drawGraph {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }

        /* Glass Card */
        .register-box {
            position: relative;
            z-index: 2;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            transition: 0.3s ease;
        }

        .register-box:hover {
            transform: translateY(-5px);
        }

        h3 {
            font-weight: 600;
            color: #1e293b;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-success {
            border-radius: 12px;
            padding: 12px;
            font-weight: 500;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            transition: 0.3s;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.4);
        }
        #spinner {
            display: none;
        }

        a {
            text-decoration: none;
            color: #6366f1;
        }

        /* Password Strength Colors */
        .progress-bar.weak { background-color: #dc3545; }
        .progress-bar.medium { background-color: #ffc107; }
        .progress-bar.strong { background-color: #28a745; }

        /* Match Text */
        #matchText { font-weight: 500; }

        /* Success Overlay */
        #successOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15,23,42,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
        }

        .success-box {
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 600;
            color: #16a34a;
            animation: pop 0.5s ease;
        }

        .toast-box {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #16a34a;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(-20px);
            transition: 0.4s ease;
            z-index: 999;
        }

        .toast-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pop {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>

<body>

<!-- Floating Math Background -->
<div class="math-bg">
    <span>∑</span>
    <span>π</span>
    <span>∫</span>
    <span>√</span>
    <span>θ</span>
    <span>∞</span>
</div>

<!-- Graph Animation -->
<div class="graph">
    <svg width="100%" height="200">
        <path d="M0 150 Q 150 50 300 120 T 600 80 T 900 140 T 1200 90"
              fill="transparent"
              stroke="#6366f1"
              stroke-width="3"/>
    </svg>
</div>

<div class="register-box">
    <h3 class="text-center mb-4">Create Account</h3>

    <div th:if="${error}" class="alert alert-danger text-center">
        <span th:text="${error}"></span>
    </div>

    <form action="/registerUser" method="post">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter full name">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter email"
                   required
                   pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                   title="Enter a valid email address (example: user@gmail.com)">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" id="password" placeholder="Create password">

            <div class="progress mt-2" style="height:6px;">
                <div id="strengthBar" class="progress-bar" style="width:0%"></div>
            </div>

            <small id="strengthText" class="text-muted"></small>
        </div>

        <div class="mb-3">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" class="form-control" id="confirmPassword" placeholder="Confirm password">
            <small id="matchText"></small>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2" id="registerBtn">
            <span id="btnText">Register</span>
            <span class="spinner-border spinner-border-sm ms-2" id="spinner"></span>
        </button>
        <!--        <button class="btn btn-success w-100">Register</button>-->

        <p class="text-center mt-3">
            Already have an account?
            <a href="/login" onclick="navigate(event, '/login')">Login here</a>
        </p>
    </form>
</div>

<div id="successToast" class="toast-box">
    ✓ Account Created Successfully!
</div>

<div id="errorToast" class="toast-box" style="background:#dc3545;">
    <span th:text="${error}"></span>
</div>

<script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const strengthBar = document.getElementById("strengthBar");
    const strengthText = document.getElementById("strengthText");
    const matchText = document.getElementById("matchText");

    const form = document.querySelector("form");
    const email = document.querySelector("input[name='email']");
    const errorToast = document.getElementById("errorToast");
    const btn = document.getElementById("registerBtn");
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");

    // Password Strength Check
    password.addEventListener("input", function() {
        const value = password.value;
        let strength = 0;

        if (value.length >= 6) strength++;
        if (/[A-Z]/.test(value)) strength++;
        if (/[0-9]/.test(value)) strength++;
        if (/[^A-Za-z0-9]/.test(value)) strength++;

        strengthBar.className = "progress-bar";

        if (strength <= 1) {
            strengthBar.style.width = "33%";
            strengthBar.classList.add("weak");
            strengthText.innerText = "Weak password";
        }
        else if (strength <= 3) {
            strengthBar.style.width = "66%";
            strengthBar.classList.add("medium");
            strengthText.innerText = "Medium strength";
        }
        else {
            strengthBar.style.width = "100%";
            strengthBar.classList.add("strong");
            strengthText.innerText = "Strong password";
        }
    });

    // Confirm Password Match
    confirmPassword.addEventListener("input", function() {
        if (confirmPassword.value === password.value) {
            matchText.innerText = "Passwords match ✓";
            matchText.style.color = "#16a34a";
        } else {
            matchText.innerText = "Passwords do not match";
            matchText.style.color = "#dc3545";
        }
    });

    function navigate(event, url) {
        event.preventDefault();
        document.body.classList.add("fade-out");

        setTimeout(() => {
            window.location.href = url;
        }, 400);
    }

    // Submit Animation
    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!emailPattern.test(email.value)){
            alert("Please enter a valid email address (example@gmail.com)");
            return;
        }

        if (password.value !== confirmPassword.value) {
            alert("Passwords do not match!");
            return;
        }

        btn.disabled = true;
        btnText.innerText = "Creating Account...";
        spinner.style.display = "inline-block";

        setTimeout(() => {

            form.submit();   // Send form immediately to backend

        }, 800);

    });

    window.addEventListener("load", function(){

        const errorMessage = "[[${error}]]";

        if(errorMessage && errorMessage !== "null"){

            errorToast.classList.add("show");

            setTimeout(() => {
                errorToast.classList.remove("show");
            }, 3000);

        }

    });
</script>

</body>
</html>
