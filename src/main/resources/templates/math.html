<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Think Smart | Math Solver</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }
        .solver-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        textarea {
            resize: none;
        }

        pre {
            font-family: "Courier New", monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/home">Think Smart</a>
    <a href="/home" class="btn btn-outline-light btn-sm">Dashboard</a>
</nav>

<div class="container mt-5">

    <h3 class="mb-3">
        <i class="bi bi-calculator"></i> Math Solver
    </h3>
    <p class="text-muted">
        Enter your math problem and get step-by-step solution
    </p>

    <div class="solver-box mt-4">

        <form action="/math/solve" method="post">
        <label class="mb-2">Enter Math Problem</label>
            <textarea class="form-control mb-3"
                      rows="4"
                      name="mathProblem"
                      placeholder="Example: 2x + 3 = 7"></textarea>

            <button class="btn btn-primary">
                Solve Problem
            </button>
        </form>

        <hr>

        <h5>Solution</h5>
        <pre class="alert alert-secondary" th:text="${steps}"></pre>

    </div>

</div>

</body>
</html>
